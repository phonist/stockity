services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - mern-network
    volumes:
      - ./client:/usr/app
      - client-node_modules:/usr/app/node_modules
    depends_on:
      server:
        condition: service_healthy
    environment:
      REACT_APP_SERVER: http://localhost:8080
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080/api}
      REACT_APP_HOST: ${REACT_APP_HOST:-localhost}
      PUBLIC_URL: ${PUBLIC_URL:-}
      NODE_ENV: ${NODE_ENV:-development}
      CHOKIDAR_USEPOLLING: "true"
    command: sh -c "yarn install --check-files --network-concurrency 1 && yarn start"
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    networks:
      - mern-network
    volumes:
      - ./server:/usr/app
      - server-node_modules:/usr/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://db:27017/stockity}
      MONGO_CA_FILE: ${MONGO_CA_FILE:-}
      PORT: ${PORT:-8080}
      CLIENT: ${CLIENT:-http://localhost:3000}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      CLIENT_URLS: ${CLIENT_URLS:-http://localhost:3000}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      jwtSecret: ${jwtSecret:-change-me}
      JWT_EXPIRE: ${JWT_EXPIRE:-5 days}
      LOG_DIR: ${LOG_DIR:-../logs}
      LOG_FORMAT: ${LOG_FORMAT:-combined}
      SWAGGER_SERVER_URL: ${SWAGGER_SERVER_URL:-http://localhost:8080}
      MARKET_STACK_API_KEY: ${MARKET_STACK_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(8080,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 25s

  db:
    image: mongo:7
    ports:
      - "27017:27017"
    networks:
      - mern-network
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  mern-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
  client-node_modules:
    driver: local
  server-node_modules:
    driver: local
